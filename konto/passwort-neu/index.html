<!-- Der Schluessel hier ist der oeffentliche Anon-Key. Er steckt in jeder
     ausgelieferten App und darf hier stehen. Schreiben kann er nur mit dem
     Einmal-Token aus der Mail, das der Browser im Adress-Fragment traegt
     und das nie an unseren Server geht.
     Sprachen (18.11.2026): Die Seite spricht die 16 App-Sprachen. Die Texte
     stehen unten in TEXTE, weil der Deploy (deploy-website.yml) web/ nur
     spiegelt und nichts baut. Knopfname, Platzhalter und "zu viele Versuche"
     sind woertlich die App-Texte aus locales/; scripts/test-passwort-seite.cjs
     prueft das. Servertext (error_description, msg) kommt nie auf die Seite. -->

  var teile = new URLSearchParams(location.hash.replace(/^#/, ''));
  var token = teile.get('access_token');
  var meldung = document.getElementById('meldung');
  var formular = document.getElementById('formular');
  var knopf = document.getElementById('knopf');

  function zeige(text, gut) {
    meldung.textContent = text;
    meldung.className = 'meldung ' + (gut ? 'gut' : 'schlecht');
    meldung.style.display = 'block';
  }

  // Abgelaufener oder schon benutzter Link: GoTrue haengt error,
  // error_code und error_description (englisch) an. Wir zeigen nur unseren Satz.
  if (teile.get('error') || teile.get('error_code') || teile.get('error_description')) {
    formular.style.display = 'none';
    zeige(T.abgelaufen, false);
  } else if (!token) {
    formular.style.display = 'none';
    document.getElementById('intro').textContent = T.ohneLink;
  }

  /** Antwort von PUT /auth/v1/user auf einen eigenen Satz abbilden, nie Servertext. */
  function fehlerSatz(status, d) {
    var code = String((d && (d.error_code || d.code || d.error)) || '');
    if (code === 'weak_password') return T.schwach;
    if (code === 'same_password') return T.gleich;
    if (status === 429 || code === 'over_request_rate_limit') return T.zuVieleVersuche;
    if (status === 401 || status === 403 || /session|jwt|otp|expired|not_found|no_authorization/.test(code)) return T.abgelaufen;
    return T.nichtGeklappt;
  }

  /** Laenge in UTF-8-Bytes, wie der Server zaehlt. */
  function utf8Laenge(text) {
    var n = 0;
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if (c < 0x80) n += 1;
      else if (c < 0x800) n += 2;
      else if (c >= 0xd800 && c < 0xdc00) { n += 4; i++; }
      else n += 3;
    }
    return n;
  }

  formular.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (pw.length < 8) { zeige(T.zuKurz, false); return; }
    // GoTrue nimmt hoechstens 72 Bytes (ein „ä" zaehlt doppelt). Darueber kam
    // vorher „Fordere notfalls einen neuen Link an", und ein Link hilft da nicht.
    if (utf8Laenge(pw) > 72) { zeige(T.zuLang, false); return; }
    knopf.disabled = true;
    fetch(SUPABASE + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + token },
      body: JSON.stringify({ password: pw })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
    })
      .then(function (a) {
        if (a.ok) {
          formular.style.display = 'none';
          zeige(T.gespeichert, true);
        } else {
          knopf.disabled = false;
          zeige(fehlerSatz(a.status, a.d), false);
        }
      })
      .catch(function () { knopf.disabled = false; zeige(T.keinNetz, false); });
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--favicon-->
<link rel="icon" href="https://linupapp.de/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://linupapp.de/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="https://linupapp.de/apple-touch-icon.png">
<meta name="theme-color" content="#F4F4F6">
<!--/favicon-->
<title>Seite nicht gefunden (404) | Linup</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://linupapp.de/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://linupapp.de/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="https://linupapp.de/apple-touch-icon.png">
<meta name="theme-color" content="#F4F4F6">
<style>
  :root{--bg:#0E1116;--bg2:#14171d;--orange:#FF6A00;--orange-soft:#FF8A2E;--ink:#F4F1EC;--ink-soft:#A5A29B;--card:#1a1e25;--border:#2a2f38;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(120% 60% at 50% 0%,#1a120a 0%,var(--bg2) 40%,var(--bg) 100%);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center;}
  .wrap{width:100%;max-width:520px;}
  .logo{width:64px;height:64px;margin:0 auto 20px;display:block;}
  .code{font-size:64px;font-weight:800;color:var(--orange);letter-spacing:-1px;line-height:1;}
  h1{font-size:24px;font-weight:800;margin:10px 0 10px;}
  p{color:var(--ink-soft);font-size:16px;margin-bottom:28px;}
  .links{display:flex;flex-direction:column;gap:12px;}
  a.btn{display:block;padding:15px 18px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px;border:1px solid var(--border);}
  .primary{background:var(--orange);color:#1a1005;border-color:transparent;}
  .secondary{background:var(--card);color:var(--ink);}
  .quick{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .quick a{color:var(--orange-soft);font-size:14px;text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:8px 12px;}
</style>
<link rel="stylesheet" href="/assets/linup.css">
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/linup-mark.svg" alt="Linup" width="44" height="44">
    <div class="code">404</div>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Der Link führt ins Leere, vielleicht ist die Seite umgezogen oder die Adresse hat einen Tippfehler.</p>
    <div class="links">
      <a class="btn primary" href="https://apps.apple.com/de/app/id6780292694">Linup im App Store laden</a>
      <a class="btn secondary" href="https://linupapp.de/">Zur Startseite</a>
      <a class="btn secondary" href="https://linupapp.de/wissen/">Alle Ratgeber ansehen</a>
    </div>
    <div class="quick">
      <a href="https://linupapp.de/faq/">Häufige Fragen</a>
      <a href="https://linupapp.de/getraenke/">Getränke</a>
      <a href="https://linupapp.de/fastfood/">Fast Food</a>
      <a href="https://linupapp.de/protein/">Protein</a>
    </div>
  </div>
</body>
</html>
